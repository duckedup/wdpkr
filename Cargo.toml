[package]
name = "wdpkr"
version = "0.14.0"
edition = "2024"
rust-version = "1.96"
description = "Codebase search via vector retrieval over LLM-generated summaries, exposed as a CLI for AI coding agents."
repository = "https://github.com/duckedup/wdpkr"
license = "MIT"

[lib]
name = "wdpkr"
path = "src/lib.rs"

[[bin]]
name = "wdpkr"
path = "src/main.rs"

[dependencies]
# The engine: repo walking, chunking, summarization, embedding, search, and
# the VectorStore seam. wdpkr is the CLI over it plus the two backends below.
wdpkr-core = "0.2"

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
nidus = "0.65"
owo-colors = { version = "4", features = ["supports-colors"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time"] }

[dev-dependencies]
serial_test = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
